<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1f8fd6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Pixel Claw Fun</title>
  </head>
  <body>
    <div id="app">
      <div id="game-container" aria-label="3D claw machine game area"></div>

      <div id="hud-top" class="hud-row">
        <button id="menu-btn" class="hud-btn" type="button">Menu</button>
        <button id="collection-btn" class="hud-btn" type="button">Collection</button>
        <button id="settings-btn" class="hud-btn" type="button">Settings</button>
      </div>

      <div id="learn-prompt" class="prompt" hidden></div>
      <div id="result-banner" class="result" hidden></div>
      <div id="caption-box" class="caption" aria-live="polite" hidden></div>

      <div id="controls" class="controls" role="group" aria-label="Game controls">
        <div class="left-controls">
          <div id="joystick-area" class="joystick-area" aria-label="Move claw joystick" aria-disabled="true">
            <div class="joystick-ring"></div>
            <div id="joystick-knob" class="joystick-knob"></div>
          </div>
        </div>
        <div class="right-controls">
          <button id="drop-btn" class="drop-btn" type="button">Drop Claw</button>
          <div class="action-stack">
            <button id="autoplay-btn" class="auto-btn" type="button">Auto Play</button>
          </div>
          <div class="control-hint">PC: WASD or Arrows + Space</div>
        </div>
      </div>

      <div id="menu-overlay" class="overlay">
        <div class="panel menu-panel">
          <button id="close-menu-x" class="panel-close" type="button" aria-label="Close menu">×</button>
          <h1>Pixel Claw Fun</h1>
          <p class="subhead">Friendly claw machine for ages 4-7</p>
          <label class="toggle-line" for="menu-learn-mode">
            <input id="menu-learn-mode" type="checkbox" />
            Learn Mode
          </label>
          <button id="start-game" class="primary-btn" type="button">Start Game</button>
          <button id="menu-open-collection" class="secondary-btn" type="button">Collection Shelf</button>
          <button id="menu-open-settings" class="secondary-btn" type="button">Settings</button>
        </div>
      </div>

      <div id="settings-panel" class="overlay" hidden>
        <div class="panel settings-panel">
          <button id="close-settings-x" class="panel-close" type="button" aria-label="Close settings">×</button>
          <h2>Settings</h2>
          <label class="toggle-line" for="pixelation-toggle"><input id="pixelation-toggle" type="checkbox" /> Pixelation</label>
          <label class="toggle-line" for="shadows-toggle"><input id="shadows-toggle" type="checkbox" /> Shadows (optional)</label>
          <label class="toggle-line" for="captions-toggle"><input id="captions-toggle" type="checkbox" /> Captions</label>
          <label class="toggle-line" for="speech-toggle"><input id="speech-toggle" type="checkbox" /> Speech</label>
          <label class="field-line" for="speech-rate">Speech Speed
            <select id="speech-rate">
              <option value="slow">Slow</option>
              <option value="normal">Normal</option>
            </select>
          </label>
          <label class="field-line" for="zoom-slider">Zoom
            <input id="zoom-slider" type="range" min="0.8" max="1.4" step="0.05" />
          </label>
          <label class="field-line" for="camera-yaw-slider">Camera Turn
            <input id="camera-yaw-slider" type="range" min="-40" max="40" step="1" />
          </label>
          <label class="field-line" for="camera-height-slider">Camera Height
            <input id="camera-height-slider" type="range" min="5.2" max="13.5" step="0.1" />
          </label>
          <label class="field-line" for="camera-distance-slider">Camera Distance
            <input id="camera-distance-slider" type="range" min="9" max="22" step="0.1" />
          </label>
          <label class="field-line" for="camera-looky-slider">Look Height
            <input id="camera-looky-slider" type="range" min="0.8" max="5.4" step="0.1" />
          </label>
          <button id="reset-camera" class="secondary-btn" type="button">Reset Camera</button>
          <label class="toggle-line" for="music-toggle"><input id="music-toggle" type="checkbox" /> Music</label>
          <label class="field-line" for="music-volume">Music Volume
            <input id="music-volume" type="range" min="0" max="1" step="0.01" />
          </label>
          <label class="toggle-line" for="sfx-toggle"><input id="sfx-toggle" type="checkbox" /> Sound Effects</label>
          <label class="field-line" for="sfx-volume">SFX Volume
            <input id="sfx-volume" type="range" min="0" max="1" step="0.01" />
          </label>
          <button id="close-settings" class="secondary-btn" type="button">Close</button>
        </div>
      </div>

      <div id="collection-panel" class="overlay" hidden>
        <div class="panel collection-panel">
          <button id="close-collection-x" class="panel-close" type="button" aria-label="Close collection">×</button>
          <h2>Collection Shelf</h2>
          <div id="collection-grid" class="collection-grid"></div>
          <div id="collection-preview" class="collection-preview">Tap a toy card to preview and hear the word.</div>
          <button id="close-collection" class="secondary-btn" type="button">Close</button>
        </div>
      </div>

      <div id="audio-overlay" class="overlay audio-overlay">
        <div class="panel audio-panel">
          <h2>Sound Setup</h2>
          <p>Tap to enable sound on iPad.</p>
          <button id="enable-audio" class="primary-btn" type="button">Tap to enable sound</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
